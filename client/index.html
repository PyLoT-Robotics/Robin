<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Robin" />
    <meta
      name="description"
      content="PyLoT Roboticsで制作しているロボットのデバッグ用コントローラーです。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Robin" />
    <meta property="og:title" content="Robin" />
    <meta
      property="og:description"
      content="PyLoT Roboticsで制作しているロボットのデバッグ用コントローラーです。"
    />
    <meta property="og:image" content="/OGP.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Robin" />
    <meta
      name="twitter:description"
      content="PyLoT Roboticsで制作しているロボットのデバッグ用コントローラーです。"
    />
    <meta name="twitter:image" content="/OGP.png" />
    <title>Robin</title>
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; background: #09090b; }
      .boot-screen {
        width: 100%;
        height: 100%;
        display: grid;
        place-content: center;
        gap: 14px;
        color: #e4e4e7;
        font: 500 16px system-ui, sans-serif;
        text-align: center;
      }
      .boot-spinner {
        width: 28px;
        height: 28px;
        margin: auto;
        border: 3px solid #3f3f46;
        border-top-color: #fafafa;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      .boot-detail { color: #a1a1aa; font-size: 13px; font-weight: 400; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-screen" role="status" aria-live="polite">
        <div class="boot-spinner" aria-hidden="true"></div>
        <span>Loading Robin…</span>
        <span id="boot-detail" class="boot-detail">Reading startup information…</span>
      </div>
    </div>
    <script>
      const detail = document.getElementById('boot-detail')
      const startedAt = performance.now()
      const source = !navigator.onLine
        ? 'Offline: loading the app core from the PWA cache'
        : navigator.serviceWorker?.controller
          ? 'Installed: loading the app core from the PWA cache'
          : 'First launch: downloading the app core'
      const updateBootDetail = () => {
        const elapsed = ((performance.now() - startedAt) / 1000).toFixed(1)
        if (detail) detail.textContent = `${source} · ${elapsed}s elapsed`
      }
      updateBootDetail()
      setInterval(updateBootDetail, 250)
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
